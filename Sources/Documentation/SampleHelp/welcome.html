<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
  :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --bg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --text: #f5f5f7; --muted: #a1a1a6; --bg: #1e1e1e; } }
  body { font: 15px/1.55 -apple-system, system-ui, sans-serif; color: var(--text); background: var(--bg);
         max-width: 44em; margin: 0 auto; padding: 24px 32px 64px; }
  p.lead { color: var(--muted); font-size: 1.1em; }
</style>
</head>
<body>
<h1>Welcome</h1>
<p class="lead">A small help for previews and tests of the Documentation package.</p>
<p>Pick a topic in the sidebar, or search: the search reads the text of every bundled page.</p>
</body>
</html>
